<!DOCTYPE html>
<html lang="fr">
<head>
    <link rel="icon" type="image/png" href="https://i.postimg.cc/Y2g29xsg/Design-sans-titre-(30).png" />
    <script src="mobile-detect.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Partie en construction - Les Blockhaus Lyssois</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .construction-container {
            max-width: 900px;
            margin: 80px auto;
            padding: 20px;
        }

        .construction-message {
            text-align: center;
            line-height: 1.6;
            font-size: 16px;
            padding: 50px 30px;
        }

        .construction-icon {
            font-size: 70px;
            margin-bottom: 20px;
        }

        .construction-message h2 {
            font-size: 26px;
            margin-bottom: 15px;
        }

        .construction-message p {
            margin-bottom: 15px;
        }

        .construction-message .small-text {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 25px;
        }

        .back-button {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <aside class="sidebar">
    </aside>

    <script src="navigation.js"></script>

    <div>
        <h1>Partie en construction</h1>

        <div class="news-container">
            <div class="news-item">
                <div class="description construction-container">

                    <div class="construction-message">

                        <div class="construction-icon">
                            🚧
                        </div>

                        <h2>Cette partie est en construction</h2>

                        <p>
                            Nous travaillons actuellement sur cette nouvelle
                            partie du site des <strong>Blockhaus Lyssois</strong>.
                        </p>

                       

                        <p class="small-text">
                            Merci de votre patience et de votre intérêt pour
                            la préservation du patrimoine historique local.
                        </p>

                        <a href="https://lesblockhauslyssois.fr" class="back-button">
